[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewbot"
version = "0.1.0"
description = "Automated PR Code Review Bot GitHub Action"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Code Review Bot Maintainers" }
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "ruff>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "types-PyYAML>=6.0.12",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[project.scripts]
reviewbot = "reviewbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reviewbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
